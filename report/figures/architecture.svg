<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <title>System architecture: two showcases</title>
  <rect width="960" height="440" fill="#ffffff"/>

  <rect x="20" y="20" width="920" height="110" rx="8" fill="#eef5ff" stroke="#4a78b5"/>
  <text x="34" y="44" font-weight="bold" fill="#1d3b63">Showcase A: static web app (client-side rendering)</text>
  <rect x="60" y="62" width="220" height="52" rx="6" fill="#ffffff" stroke="#333"/>
  <text x="170" y="84" text-anchor="middle" fill="#111">Vite dev server</text>
  <text x="170" y="102" text-anchor="middle" fill="#111">serves files only</text>
  <rect x="640" y="62" width="280" height="52" rx="6" fill="#ffffff" stroke="#333"/>
  <text x="780" y="84" text-anchor="middle" fill="#111">Browser: vtk.js + WebGL2</text>
  <text x="780" y="102" text-anchor="middle" fill="#111">volume rendering</text>
  <line x1="280" y1="96" x2="627.0" y2="96.0" stroke="#333" stroke-width="2"/>
  <polygon points="638,96 627.0,101.0 627.0,91.0" fill="#333"/>
  <text x="460" y="88" text-anchor="middle" fill="#111">.vti data + JS (downloaded once)</text>

  <rect x="20" y="150" width="920" height="210" rx="8" fill="#fff4e8" stroke="#c07a2c"/>
  <text x="34" y="174" font-weight="bold" fill="#5a3410">Showcase B: trame app under pvpython</text>
  <rect x="50" y="240" width="190" height="64" rx="6" fill="#ffffff" stroke="#333"/>
  <text x="145" y="264" text-anchor="middle" fill="#111">ParaView pipeline</text>
  <text x="145" y="284" text-anchor="middle" fill="#111">Wavelet - Contour - Show</text>
  <rect x="290" y="240" width="190" height="64" rx="6" fill="#ffffff" stroke="#333"/>
  <text x="385" y="264" text-anchor="middle" fill="#111">trame server</text>
  <text x="385" y="284" text-anchor="middle" fill="#111">wslink WebSocket</text>
  <line x1="240" y1="272" x2="277.0" y2="272.0" stroke="#333" stroke-width="2"/>
  <polygon points="288,272 277.0,277.0 277.0,267.0" fill="#333"/>

  <rect x="700" y="188" width="220" height="56" rx="6" fill="#ffffff" stroke="#333"/>
  <text x="810" y="210" text-anchor="middle" fill="#111">Browser (remote mode)</text>
  <text x="810" y="229" text-anchor="middle" fill="#111">shows images</text>
  <rect x="700" y="290" width="220" height="56" rx="6" fill="#ffffff" stroke="#333"/>
  <text x="810" y="312" text-anchor="middle" fill="#111">Browser (local mode)</text>
  <text x="810" y="331" text-anchor="middle" fill="#111">vtk.js renders every frame</text>

  <line x1="480" y1="256" x2="687.1" y2="225.6" stroke="#333" stroke-width="2"/>
  <polygon points="698,224 687.8,230.5 686.4,220.7" fill="#333"/>
  <text x="590" y="196" text-anchor="middle" fill="#111">remote:</text>
  <text x="590" y="213" text-anchor="middle" fill="#111">compressed images</text>
  <line x1="480" y1="288" x2="687.1" y2="316.5" stroke="#333" stroke-width="2"/>
  <polygon points="698,318 686.4,321.5 687.8,311.5" fill="#333"/>
  <text x="590" y="334" text-anchor="middle" fill="#111">local: geometry,</text>
  <text x="590" y="351" text-anchor="middle" fill="#111">once per change</text>

  <rect x="330" y="385" width="300" height="34" rx="6" fill="#f2f2f2" stroke="#666" stroke-dasharray="5,4"/>
  <text x="480" y="407" text-anchor="middle" fill="#111">Shared datasets and benchmark harness</text>
</svg>
