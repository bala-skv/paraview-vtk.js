<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <title>System architecture: two showcases</title>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>
  <rect x="20" y="20" width="860" height="110" rx="8" fill="#eef5ff" stroke="#4a78b5"/>
  <text x="34" y="44" font-weight="bold" fill="#1d3b63">Showcase A: static web app (client-side rendering)</text>
  <rect x="60" y="62" width="220" height="52" rx="6" fill="#ffffff" stroke="#333"/>
  <text x="170" y="84" text-anchor="middle" fill="#111">Vite dev server</text>
  <text x="170" y="102" text-anchor="middle" fill="#111">serves files only</text>
  <rect x="560" y="62" width="280" height="52" rx="6" fill="#ffffff" stroke="#333"/>
  <text x="700" y="84" text-anchor="middle" fill="#111">Browser: vtk.js + WebGL2</text>
  <text x="700" y="102" text-anchor="middle" fill="#111">volume rendering</text>
  <line x1="280" y1="88" x2="558" y2="88" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
  <text x="420" y="80" text-anchor="middle" fill="#111">.vti + JS</text>
  <rect x="20" y="150" width="860" height="200" rx="8" fill="#fff4e8" stroke="#c07a2c"/>
  <text x="34" y="174" font-weight="bold" fill="#5a3410">Showcase B: trame app under pvpython</text>
  <rect x="60" y="230" width="210" height="64" rx="6" fill="#ffffff" stroke="#333"/>
  <text x="165" y="254" text-anchor="middle" fill="#111">ParaView pipeline</text>
  <text x="165" y="274" text-anchor="middle" fill="#111">Wavelet - Contour - Show</text>
  <rect x="330" y="230" width="190" height="64" rx="6" fill="#ffffff" stroke="#333"/>
  <text x="425" y="254" text-anchor="middle" fill="#111">trame server</text>
  <text x="425" y="274" text-anchor="middle" fill="#111">wslink WebSocket</text>
  <line x1="270" y1="262" x2="328" y2="262" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="640" y="190" width="220" height="56" rx="6" fill="#ffffff" stroke="#333"/>
  <text x="750" y="212" text-anchor="middle" fill="#111">Browser (remote mode)</text>
  <text x="750" y="231" text-anchor="middle" fill="#111">shows images</text>
  <rect x="640" y="280" width="220" height="56" rx="6" fill="#ffffff" stroke="#333"/>
  <text x="750" y="302" text-anchor="middle" fill="#111">Browser (local mode)</text>
  <text x="750" y="321" text-anchor="middle" fill="#111">vtk.js renders every frame</text>
  <line x1="520" y1="250" x2="638" y2="222" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
  <text x="545" y="216" fill="#111">remote: compressed images</text>
  <line x1="520" y1="276" x2="638" y2="306" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
  <text x="520" y="330" fill="#111">local: geometry, once per change</text>
  <rect x="300" y="372" width="300" height="34" rx="6" fill="#f2f2f2" stroke="#666" stroke-dasharray="5,4"/>
  <text x="450" y="394" text-anchor="middle" fill="#111">Shared datasets and benchmark harness</text>
</svg>
