<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vtk.js Showcase A</title>
    <style>
      html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; background: #14141e; color: #ddd; }
      #app { position: absolute; inset: 0; }
      #panel { position: absolute; left: 0; top: 0; bottom: 0; width: 280px; box-sizing: border-box; padding: 12px;
               overflow-y: auto; background: #1d1d2b; display: flex; flex-direction: column; gap: 10px; }
      #panel h1 { font-size: 15px; margin: 0 0 4px; }
      #panel label { display: flex; flex-direction: column; gap: 3px; }
      #panel label.row { flex-direction: row; align-items: center; gap: 6px; }
      #panel select, #panel button { padding: 4px; }
      #panel small { color: #889; }
      #panel fieldset { border: 1px solid #335; display: flex; flex-direction: column; gap: 8px; }
      #drop { border: 1px dashed #557; padding: 8px; text-align: center; color: #99a; }
      #drop.over { border-color: #8cf; color: #8cf; }
      #tools > summary { cursor: pointer; font-weight: 600; }
      #toolsBody { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
      #toolsBody fieldset { padding: 6px; gap: 5px; min-width: 0; margin: 0; }
      #toolsBody legend { font-size: 12px; color: #9ac; }
      #toolsBody canvas { max-width: 100%; }
      #toolsBody output.res { font: 11px monospace; color: #9f9; white-space: pre-wrap; }
      #info { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin: 0; font-size: 12px; }
      #info dt { color: #99a; } #info dd { margin: 0; word-break: break-word; }
      #view { position: absolute; left: 280px; right: 0; top: 0; bottom: 0; }
      #view > div[class*="Container"] { position: absolute; left: 8px; top: 8px; z-index: 3; background: #fffd; color: #000; opacity: .92; }
      #app.bench { background: #14141e; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
